# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Este agendamento consulta o banco a cada 3 dias. No dia 1 de cada mês também
# grava um commit, porque o GitHub desliga agendamentos de repositórios
# públicos que passam 60 dias sem atividade.
name: Manter o banco ativo
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js)
          CHAVE=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" js/config.js)
          curl -sf -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}'
      - name: Registrar atividade no dia 1 de cada mês
        # O cron "*/3" sempre roda no dia 1; o disparo manual também grava.
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +%Y-%m-%dT%H:%MZ > .ultima-atividade
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ultima-atividade
            git commit -m "Manter o agendamento ativo" || exit 0
            git push
          fi
